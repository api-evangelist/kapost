name: Kapost
description: >-
  Kapost is a content operations platform — now part of Upland Software — that
  lets B2B marketing teams plan, produce, distribute, and analyze content across
  the customer journey through its Canvas, Studio, Gallery, and Insights modules.
  Kapost exposes a versioned REST Content API (/api/v1) secured with HTTP Basic
  authentication using a per-user API token and returning JSON, plus outbound
  content webhooks (create/update/publish/delete), an XML-RPC interface, and a
  first-party WordPress plugin for publishing content from Kapost to WordPress
  sites. This profile was enriched from Kapost's live developer portal.
