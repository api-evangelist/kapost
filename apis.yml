apis:
- name: Kapost Content API
  description: >-
    Versioned REST Content API with 67 documented operations across content,
    collections, comments, reminders, tasks, visibility, ideas, initiatives,
    custom fields, content types, destinations, memberships, users and insights.
    HTTP Basic auth with a per-user API token (password ignored); JSON responses
    wrapped in a response/count/pagination envelope; page/per_page pagination;
    basic/full/dynamic response detail levels; uri-path versioning. The callable
    base URL is the customer's own instance subdomain
    (https://{instance}.kapost.com/api/v1) — there is no shared API host. The
    developer portal ships a live "Try it" API playground for every endpoint. No
    OpenAPI specification is published.
  humanURL: https://developer.kapost.com/
  baseURL: https://api.kapost.com/api/v1
