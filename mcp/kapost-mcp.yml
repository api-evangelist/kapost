generated: '2026-08-13'
method: derived
status: candidate
source: https://developer.kapost.com/ (documented Content API operation surface)
note: >-
  Kapost ships NO MCP server. Searches of the developer portal, the public github.com/kapost
  organization (~100 repos), npm (@modelcontextprotocol and @kapost scopes) and the MCP registries
  found nothing, and no /mcp or /sse endpoint answers on any Kapost host. The tools below are a
  DERIVED CANDIDATE surface — what an MCP server over the documented Content API would expose —
  not a product Kapost publishes. Because nothing is shipped, NO `MCPServer` pointer is emitted in
  apis.yml: the pointer would assert an agent surface the provider does not serve.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: searched
server:
  name: kapost
  transport: null
  url: null
authentication_if_built:
  scheme: http-basic
  detail: >-
    Any server would carry the customer's per-user API token as the Basic username against their
    own instance subdomain — there is no OAuth surface to delegate to, which is a real barrier to a
    hosted multi-tenant MCP server.
